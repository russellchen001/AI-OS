[package]
name = "dashboard"
version = "1.0.0"
description = "AI OS Personal AI Workspace"
authors = ["Russell Chen"]
edition = "2021"

[lib]
name = "dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
flate2 = "1"
tar = "0.4"
tempfile = "3"

tungstenite = {
  version = "0.27",
  features = ["native-tls"]
}

url = "2"
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.13", features = ["json", "stream", "form"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "net", "io-util", "time"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tauri-plugin-deep-link = "2.4.9"
zip = { version = "2", default-features = false, features = ["deflate"] }

# PDF is a format, not an application, so it is read in Rust on every platform
# rather than by driving whatever the operating system happens to ship.
lopdf = "0.44"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[profile.dev]
incremental = true
debug = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
incremental = false
debug = false
overflow-checks = false
